<div class="card shadow-lg border-0 rounded-lg" style="max-width: 700px">
  <div class="card-header text-center py-3" [class]="esEdicion ? 'bg-warning text-dark' : 'bg-success text-white'">
    <h3 class="mb-0 fw-bold">
      <i class="bi bi-speedometer me-2"></i>{{ esEdicion ? 'Editar Lectura de Medidor' : 'Registrar Lectura de Medidor' }}
    </h3>
  </div>
  <div class="card-body p-4 bg-white">
    <form [formGroup]="formulario" (ngSubmit)="guardar()">

      <div class="form-floating mb-3">
        <select class="form-select fw-bold text-dark" id="medidorId" formControlName="medidorId"
                [class.is-invalid]="invalido('medidorId')">
          <option [ngValue]="0">Seleccione el suministro...</option>
          @for (m of medidores(); track m.valor) {
            <option [ngValue]="m.valor">{{ m.texto }}</option>
          }
        </select>
        <label for="medidorId">Medidor / Suministro</label>
        <div class="invalid-feedback">Seleccione un medidor.</div>
      </div>

      <div class="form-floating mb-3">
        <input type="date" class="form-control fw-bold" id="fechaLectura" formControlName="fechaLectura"
               [class.is-invalid]="invalido('fechaLectura')">
        <label for="fechaLectura">Fecha de Lectura</label>
        <div class="invalid-feedback">La fecha de lectura es obligatoria.</div>
      </div>

      <div class="form-floating mb-3">
        <input type="number" step="0.01" class="form-control font-monospace fw-bold text-dark" id="valor"
               formControlName="valor" placeholder="Consumo registrado" [class.is-invalid]="invalido('valor')">
        <label for="valor">Valor Métrico Consumido</label>
        <div class="invalid-feedback">El valor del consumo registrado debe ser un número positivo.</div>
      </div>

      <div class="d-flex justify-content-between mt-4 border-top pt-3">
        <a class="btn btn-secondary fw-bold px-4 shadow-sm" routerLink="/lecturas">
          <i class="bi bi-arrow-left-circle me-1"></i> Volver
        </a>
        <button type="submit" class="btn fw-bold px-4 shadow-sm" [disabled]="guardando()"
                [class]="esEdicion ? 'btn-primary' : 'btn-success'">
          <i class="bi bi-save me-1"></i> {{ esEdicion ? 'Guardar Cambios' : 'Guardar Lectura' }}
        </button>
      </div>
    </form>
  </div>
</div>
