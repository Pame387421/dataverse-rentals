<div class="card shadow-lg border-0 rounded-lg" style="max-width: 650px">
  <div class="card-header bg-success text-white text-center py-3">
    <h3 class="mb-0 fw-bold"><i class="bi bi-journal-check me-2"></i>Registrar Encuesta</h3>
  </div>

  <div class="card-body p-4 bg-white">
    <form [formGroup]="formulario" (ngSubmit)="guardar()">

      @if (auth.esAdministrador()) {
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">Usuario / Residente</label>
          <select class="form-select text-dark" formControlName="usuarioId" [class.is-invalid]="invalido('usuarioId')">
            <option [ngValue]="0">-- Seleccione un Usuario --</option>
            @for (u of usuarios(); track u.valor) {
              <option [ngValue]="u.valor">{{ u.texto }}</option>
            }
          </select>
          <div class="invalid-feedback">Seleccione un usuario.</div>
        </div>
      }

      <div class="mb-3">
        <label class="form-label text-secondary small fw-bold">Calificación (1 al 5)</label>
        <div class="input-group has-validation">
          <span class="input-group-text bg-light text-warning"><i class="bi bi-star-fill"></i></span>
          <input type="number" min="1" max="5" class="form-control fw-bold font-monospace text-dark"
                 formControlName="calificacion" placeholder="Ej: 5" [class.is-invalid]="invalido('calificacion')">
          <div class="invalid-feedback">La calificación debe ser un número del 1 al 5.</div>
        </div>
        <div class="form-text text-muted small mt-1">Donde 1 es muy insatisfecho y 5 representa un servicio excelente.</div>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small fw-bold">Comentario / Feedback Adicional</label>
        <textarea class="form-control text-dark" rows="4" formControlName="comentario" maxlength="500"
                  placeholder="Escriba aquí los detalles sobre su experiencia, sugerencias de mejora o reclamos estructurales..."
                  [class.is-invalid]="invalido('comentario')"></textarea>
        <div class="invalid-feedback">El comentario es obligatorio.</div>
      </div>

      <div class="d-flex justify-content-between mt-4 border-top pt-3">
        <a class="btn btn-secondary fw-bold px-4 shadow-sm" [routerLink]="volver">
          <i class="bi bi-arrow-left-circle me-1"></i> Volver
        </a>
        <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm" [disabled]="guardando()">
          <i class="bi bi-save me-1"></i> Guardar Encuesta
        </button>
      </div>
    </form>
  </div>
</div>
