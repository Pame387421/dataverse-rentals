<h2 class="text-primary mb-4 fw-bold">
  <i class="bi bi-door-open-fill me-2"></i>{{ esEdicion ? 'Editar Departamento' : 'Nuevo Departamento' }}
</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="card shadow-sm p-4 border-0 rounded-3 bg-white">
    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label text-secondary small fw-bold">Complejo / Edificio</label>
        <select class="form-select" formControlName="edificioId" [class.is-invalid]="invalido('edificioId')">
          <option [ngValue]="0">Seleccione un complejo...</option>
          @for (e of edificios(); track e.id) {
            <option [ngValue]="e.id">{{ e.nombre }}</option>
          }
        </select>
        <div class="invalid-feedback">Seleccione un edificio.</div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label text-secondary small fw-bold">Nivel / Piso</label>
        <input type="number" class="form-control" formControlName="piso" placeholder="Ej: 3"
               [class.is-invalid]="invalido('piso')">
        <div class="invalid-feedback">El piso debe estar entre 1 y 100.</div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label text-secondary small fw-bold">Número de Departamento</label>
        <input class="form-control" formControlName="numeroDepartamento" placeholder="Ej: 302-A"
               [class.is-invalid]="invalido('numeroDepartamento')">
        <div class="invalid-feedback">El número de departamento es obligatorio (máx. 20 caracteres).</div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label text-secondary small fw-bold">Área Privativa (m²)</label>
        <input type="number" step="0.01" class="form-control" formControlName="areaM2" placeholder="Ej: 75.50"
               [class.is-invalid]="invalido('areaM2')">
        <div class="invalid-feedback">Ingrese un área mayor que cero.</div>
      </div>

      <div class="col-12 mb-3">
        <div class="form-floating">
          <select class="form-select" id="estadoAcabados" formControlName="estadoAcabados"
                  [class.is-invalid]="invalido('estadoAcabados')">
            <option value="">Seleccione...</option>
            @for (estado of estadosAcabados; track estado) {
              <option [value]="estado">{{ estado }}</option>
            }
          </select>
          <label for="estadoAcabados">Estado de Acabados Inmobiliarios</label>
          <div class="invalid-feedback">Seleccione el estado de acabados.</div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4 border-top pt-3">
      <a class="btn btn-secondary fw-bold px-4 shadow-sm" routerLink="/departamentos">
        <i class="bi bi-arrow-left-circle me-1"></i> Volver
      </a>
      <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm" [disabled]="guardando()">
        <i class="bi bi-save me-1"></i> Guardar Departamento
      </button>
    </div>
  </div>
</form>
