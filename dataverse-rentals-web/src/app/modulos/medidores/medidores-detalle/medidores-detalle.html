@if (medidor(); as m) {
  <div class="card shadow-lg border-0 rounded-lg">
    <div class="card-header bg-info text-white text-center py-3">
      <h3 class="mb-0 fw-bold"><i class="bi bi-eye-fill me-2"></i>Detalles del Medidor</h3>
    </div>
    <div class="card-body p-4 bg-white">

      <dl class="row mb-0 pb-3 border-bottom">
        <dt class="col-sm-3 text-secondary small text-uppercase fw-bold">Tipo de Medidor</dt>
        <dd class="col-sm-9 text-dark fw-semibold"><i class="bi bi-speedometer2 text-muted me-1"></i> {{ m.tipo }}</dd>

        <dt class="col-sm-3 text-secondary small text-uppercase fw-bold mt-3">Número de Serie</dt>
        <dd class="col-sm-9 mt-3 text-dark font-monospace fw-bold"><code>{{ m.numeroSerie }}</code></dd>

        <dt class="col-sm-3 text-secondary small text-uppercase fw-bold mt-3">Departamento / Ubicación</dt>
        <dd class="col-sm-9 mt-3 text-muted">
          <i class="bi bi-building text-secondary me-1"></i>
          Piso {{ m.piso }} - Dpto {{ m.numeroDepartamento }} - {{ m.edificioNombre }}
        </dd>
      </dl>

      <div class="d-flex justify-content-between mt-4">
        <a class="btn btn-secondary fw-bold px-4 shadow-sm" routerLink="/medidores">
          <i class="bi bi-arrow-left-circle me-1"></i> Volver
        </a>
        <div>
          <a class="btn btn-warning fw-bold px-4 shadow-sm text-dark me-2" [routerLink]="['/medidores/editar', m.id]">
            <i class="bi bi-pencil-square me-1"></i> Editar
          </a>
          <button class="btn btn-danger fw-bold px-4 shadow-sm" (click)="eliminar()">
            <i class="bi bi-trash me-1"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="text-center p-5"><div class="spinner-border"></div></div>
}
