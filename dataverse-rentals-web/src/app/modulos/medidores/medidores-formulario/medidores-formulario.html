<div class="card shadow-lg border-0 rounded-lg" style="max-width: 700px">
  <div class="card-header text-center py-3" [class]="esEdicion ? 'bg-warning text-dark' : 'bg-success text-white'">
    <h3 class="mb-0 fw-bold">
      <i class="bi me-2" [class]="esEdicion ? 'bi-pencil-square' : 'bi-file-earmark-plus'"></i>
      {{ esEdicion ? 'Editar Medidor' : 'Registrar Medidor' }}
    </h3>
  </div>
  <div class="card-body p-4 bg-white">
    <form [formGroup]="formulario" (ngSubmit)="guardar()">

      <div class="form-floating mb-3">
        <select class="form-select" id="tipo" formControlName="tipo" [class.is-invalid]="invalido('tipo')">
          <option value="">Seleccione...</option>
          @for (t of tipos; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
        <label for="tipo">Tipo de Medidor / Suministro</label>
        <div class="invalid-feedback">Seleccione el tipo de medidor.</div>
      </div>

      <div class="form-floating mb-3">
        <input class="form-control font-monospace" id="numeroSerie" formControlName="numeroSerie"
               placeholder="Número de Serie" [class.is-invalid]="invalido('numeroSerie')">
        <label for="numeroSerie">Número de Serie (Código de Fábrica)</label>
        <div class="invalid-feedback">El número de serie es obligatorio (máx. 50 caracteres).</div>
      </div>

      <div class="form-floating mb-3">
        <select class="form-select" id="departamentoId" formControlName="departamentoId"
                [class.is-invalid]="invalido('departamentoId')">
          <option [ngValue]="0">Seleccione...</option>
          @for (d of departamentos(); track d.valor) {
            <option [ngValue]="d.valor">{{ d.texto }}</option>
          }
        </select>
        <label for="departamentoId">Departamento / Unidad Inmobiliaria</label>
        <div class="invalid-feedback">Seleccione un departamento.</div>
      </div>

      <div class="d-flex justify-content-between mt-4 border-top pt-3">
        <a class="btn btn-secondary fw-bold px-4 shadow-sm" routerLink="/medidores">
          <i class="bi bi-arrow-left-circle me-1"></i> Volver
        </a>
        <button type="submit" class="btn fw-bold px-4 shadow-sm" [disabled]="guardando()"
                [class]="esEdicion ? 'btn-warning text-dark' : 'btn-success'">
          <i class="bi bi-save me-1"></i> {{ esEdicion ? 'Guardar Cambios' : 'Guardar Suministro' }}
        </button>
      </div>
    </form>
  </div>
</div>
