<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="text-center p-4">
    <i class="bi bi-compass display-1 text-secondary"></i>
    <h1 class="fw-bold mt-3">Página no encontrada</h1>
    <p class="text-muted">La dirección que escribiste no existe o fue movida.</p>
    <a class="btn btn-success fw-bold px-4" [routerLink]="auth.estaAutenticado() ? auth.rutaInicio() : '/inicio-sesion'">
      <i class="bi bi-house-door me-1"></i> {{ auth.estaAutenticado() ? 'Volver al inicio' : 'Ir al inicio de sesión' }}
    </a>
  </div>
</div>
