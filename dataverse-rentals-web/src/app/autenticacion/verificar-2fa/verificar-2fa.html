<div class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg p-4">
          <div class="text-center mb-3">
            <i class="bi bi-shield-lock-fill text-warning display-4"></i>
            <h4 class="fw-bold text-dark mt-2">Verificación de Identidad</h4>
            <p class="text-muted small">Ingrese el código digital de 6 dígitos provisto por su aplicación Google Authenticator</p>
          </div>

          @if (error()) {
            <div class="alert alert-danger small py-2 text-center mb-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error() }}
            </div>
          }

          <form [formGroup]="formulario" (ngSubmit)="validar()">
            <div class="mb-4">
              <input type="text" class="form-control form-control-lg text-center font-monospace fw-bold tracking-widest text-dark"
                     formControlName="token" placeholder="000000" maxlength="6" inputmode="numeric"
                     autocomplete="one-time-code" autofocus
                     [class.is-invalid]="formulario.controls.token.touched && formulario.controls.token.invalid">
              <div class="invalid-feedback text-center">El código debe tener 6 dígitos.</div>
            </div>

            <button class="btn btn-warning text-dark btn-lg w-100 fw-bold shadow-sm py-2" type="submit"
                    style="font-size: 1rem;" [disabled]="cargando()">
              <i class="bi bi-unlock-fill me-1"></i> Validar Token
            </button>

            <div class="text-center mt-3">
              <a routerLink="/inicio-sesion" class="text-muted small text-decoration-none">Volver al inicio de sesión</a>
            </div>
          </form>

          <!-- TEMPORAL: borrar cuando exista el login real -->
          <div class="alert alert-secondary small mt-3 mb-0 text-center">Código de prueba: <code>123456</code></div>
        </div>
      </div>
    </div>
  </div>
</div>
