<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow border-0 rounded-lg">
      <div class="card-header bg-warning text-dark p-4 text-center">
        <h3 class="mb-1 fw-bold"><i class="bi bi-key-fill me-2"></i>Cambiar contraseña</h3>
        @if (forzado()) {
          <p class="mb-0 small">Ingresaste con una contraseña temporal. Elige una nueva para continuar.</p>
        }
      </div>

      <div class="card-body p-4">
        @if (error()) {
          <div class="alert alert-danger small py-2 mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error() }}
          </div>
        }

        <form [formGroup]="formulario" (ngSubmit)="guardar()">
          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Contraseña actual</label>
            <input type="password" class="form-control" formControlName="claveActual" autocomplete="current-password"
                   [class.is-invalid]="invalido('claveActual')">
            <div class="invalid-feedback">Ingrese su contraseña actual.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Contraseña nueva</label>
            <input type="password" class="form-control" formControlName="claveNueva" autocomplete="new-password"
                   [class.is-invalid]="invalido('claveNueva')">
            <div class="invalid-feedback">Mínimo 10 caracteres, con letras y números.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Repetir contraseña nueva</label>
            <input type="password" class="form-control" formControlName="confirmar" autocomplete="new-password"
                   [class.is-invalid]="invalido('confirmar') || (formulario.controls.confirmar.touched && formulario.hasError('noCoinciden'))">
            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
          </div>

          <div class="d-flex justify-content-between mt-4 border-top pt-3">
            @if (!forzado()) {
              <a class="btn btn-secondary fw-bold px-4 shadow-sm" [routerLink]="auth.rutaInicio()">Cancelar</a>
            } @else {
              <span></span>
            }
            <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm" [disabled]="guardando()">
              <i class="bi bi-save me-1"></i> Guardar contraseña
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
