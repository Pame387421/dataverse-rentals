spring.profiles.active=dev
spring.application.name=rentals-backend
# ---------- Base de datos: todo por variables de entorno, sin valores por defecto ----------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DataverseRentals_Spring;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=rentals_user
spring.datasource.password=123
# ---------- JPA / Hibernate ----------
# "validate": al arrancar, Hibernate compara cada entidad con su tabla y falla si algo no coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Tus columnas de texto son NVARCHAR; sin esto "validate" las rechaza por esperar VARCHAR.
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# ---------- Seguridad (JWT) ----------
app.jwt.secret=${DATAVERSE_JWT_SECRET:}
app.jwt.permitir-temporal=true
app.jwt.horas-acceso=2
app.jwt.minutos-mfa=5
# ---------- Cuentas ----------
app.seed.habilitado=false
app.seed.mfa-admin=false
# Administrador inicial: solo se usa si todavía no existe su cuenta de acceso
app.bootstrap.admin-correo=admin@dataverserentals.pe
app.bootstrap.admin-clave=ClaveSeguraAdmin123!
# ---------- CORS: orígenes separados por coma. Vacío = sin CORS (Angular y API en el mismo servidor) ----------
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
# ---------- Archivos (contratos y vouchers en PDF) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.uploads.dir=${UPLOADS_DIR:uploads}
# ---------- API externa: consulta de DNI / RUC ----------
app.consulta-documento.url=https://api.apis.net.pe/v2
app.consulta-documento.token=${APIS_NET_PE_TOKEN:}
app.consulta-documento.timeout-segundos=5

# ---------- Errores: no filtrar detalles internos ----------
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
